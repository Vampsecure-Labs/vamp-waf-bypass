[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-waf-bypass"
version = "1.1.0"
description = "WAF evasion tester — 15 bypass checks for authorized security testing"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "VampSecure Studios", email = "belky@protonmail.ch" }]
requires-python = ">=3.9"
keywords = ["security", "waf", "bypass", "pentest", "firewall", "evasion"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
vamp-waf-bypass = "vamp_waf_bypass:main_entry"

[project.urls]
Homepage = "https://vampsecurestudios.com"
Repository = "https://github.com/Vampsecure-Labs/vamp-waf-bypass"

[tool.setuptools]
py-modules = ["vamp_waf_bypass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
